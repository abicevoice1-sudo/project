<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="sr-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D1FAE5"/>
    </linearGradient>
    <mask id="sr-under">
      <rect width="512" height="512" fill="white"/>
      <circle cx="312" cy="302" r="86" fill="none" stroke="black" stroke-width="76"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sr-bg)"/>
  <!-- back ring (passes under) -->
  <g mask="url(#sr-under)">
    <circle cx="200" cy="210" r="86" fill="none" stroke="url(#sr-ring)" stroke-width="54"/>
  </g>
  <!-- front ring (passes over) -->
  <circle cx="312" cy="302" r="86" fill="none" stroke="url(#sr-ring)" stroke-width="54"/>
  <!-- gold accent dot where rings meet -->
  <circle cx="256" cy="256" r="20" fill="#F5C86B"/>
</svg>
