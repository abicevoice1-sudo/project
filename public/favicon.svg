<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ShiaRishta favicon — "Nikah Knot" small-size variant: same DNA as the app
       icon, keyline removed (mud below 40px), star enlarged for crispness. -->
  <defs>
    <linearGradient id="srkf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33604F"/>
      <stop offset="1" stop-color="#1B3D31"/>
    </linearGradient>
    <radialGradient id="srkf-star" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#DDAE54"/>
      <stop offset="1" stop-color="#B98334"/>
    </radialGradient>
    <mask id="srkf-under">
      <rect width="64" height="64" fill="white"/>
      <circle cx="39.25" cy="38" r="11" fill="none" stroke="black" stroke-width="9.75"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14.5" fill="url(#srkf-bg)"/>
  <g mask="url(#srkf-under)">
    <circle cx="24.75" cy="26" r="11" fill="none" stroke="#FFFAF4" stroke-width="6.75"/>
  </g>
  <circle cx="39.25" cy="38" r="11" fill="none" stroke="#FFFAF4" stroke-width="6.75"/>
  <polygon fill="url(#srkf-star)" stroke="#8A5F22" stroke-width="0.5" stroke-linejoin="round"
    points="32,27 32.8,30 35.5,28.5 34,31.2 37,32 34,32.8 35.5,35.5 32.8,34 32,37 31.2,34 28.5,35.5 30,32.8 27,32 30,31.2 28.5,28.5 31.2,30"/>
</svg>
