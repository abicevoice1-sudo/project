name: Debug UA responses
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probe with bot user-agents
        run: |
          for ua in "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"; do
            echo "=== UA: ${ua:0:40}..."
            for path in "/" "/shia-matrimony-usa" "/blog/the-art-of-intentional-matchmaking"; do
              code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 30 -A "$ua" "https://shiarishta.com$path")
              echo "  $code $path"
            done
          done
