name: Debug API health
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: |
          echo "=== API health ==="; curl -sk --max-time 30 -w "\nHTTP %{http_code}\n" https://shiarishta.com/api/health | head -20
          echo "=== frontend ==="; curl -sk -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 https://shiarishta.com/
          echo "=== api index ==="; curl -sk --max-time 30 -w "\nHTTP %{http_code}\n" https://shiarishta.com/api/ | head -10
