name: Test mail
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Upload mail probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > /tmp/mailtest.php <<'PHPEOF'
          <?php
          require __DIR__ . '/.env.php';
          require __DIR__ . '/lib/mail.php';
          $r = mailSend([
            'to' => 'abicevoice1@gmail.com',
            'subject' => 'ShiaRishta mail probe',
            'text' => 'If you get this, PHP mail() works. Time: ' . date('c'),
          ]);
          echo json_encode($r);
          PHPEOF
          curl -s --insecure --ftp-ssl "ftps://$FTP_USER:$FTP_PASS@$FTP_SERVER/public_html/api/mailtest.php" -T /tmp/mailtest.php
          echo ""
          echo "=== Running probe ==="
          curl -sk "https://shiarishta.com/api/mailtest.php"
          echo ""
      - name: Cleanup probe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl -s --insecure --ftp-ssl "ftps://$FTP_USER:$FTP_PASS@$FTP_SERVER/" -Q "DELE /public_html/api/mailtest.php" -o /dev/null || true
          echo "cleaned"
