name: Mail debug
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint mail lib
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l php-api/lib/mail.php
      - name: Check deploy env
        run: grep -n "MAIL" .github/workflows/deploy.yml
