name: Get DKIM Record
on:
  workflow_dispatch:

jobs:
  get-dkim:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch DKIM keys via cPanel UAPI
        env:
          CPANEL_USER: shiarishta
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== Trying cPanel UAPI for DKIM ==="
          # List DKIM keys
          RESPONSE=$(curl -sk -u "${CPANEL_USER}:${CPANEL_PASS}" \
            "https://ind85.server.broker:2083/execute/EmailAuth/list_dkim_keys" \
            --max-time 30)
          echo "Response length: ${#RESPONSE}"
          echo "$RESPONSE" | head -c 2000
          echo ""
          echo "=== Done ==="
