name: tmp-dns-enum
on: { workflow_dispatch: {} }
jobs:
  enum:
    runs-on: ubuntu-latest
    steps:
      - run: |
          AUTH=103.178.113.48
          echo "=== A @ apex ===";      dig +short @$AUTH shiarishta.com A
          echo "=== AAAA ===";          dig +short @$AUTH shiarishta.com AAAA
          echo "=== www CNAME/A ===";  dig +short @$AUTH www.shiarishta.com CNAME; dig +short @$AUTH www.shiarishta.com A
          echo "=== MX ===";           dig +short @$AUTH shiarishta.com MX
          echo "=== TXT ===";          dig +short @$AUTH shiarishta.com TXT
          echo "=== NS ===";           dig +short @$AUTH shiarishta.com NS
          echo "=== SOA ===";          dig +short @$AUTH shiarishta.com SOA
          echo "=== common subdomains ==="
          for s in api mail webmail cpanel whm ftp blog dev staging; do
            r=$(dig +short @$AUTH $s.shiarishta.com A | head -1)
            [ -n "$r" ] && echo "$s -> $r"
          done
