name: Debug API diag probe
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PYEOF2'
          import requests, re, os, time, urllib3
          urllib3.disable_warnings()
          CPANEL = 'https://ind85.server.broker:2083'
          USER = os.environ['CPANEL_USER']; PASS = os.environ['CPANEL_PASS']
          s = requests.Session()
          r = s.post(f'{CPANEL}/login/', data={'user': USER, 'pass': PASS},
                     allow_redirects=False, verify=False, timeout=30)
          m = re.search(r'/cpsess(\d+)/', r.headers.get('Location', ''))
          assert m, 'CPANEL LOGIN FAILED'
          base = f"{CPANEL}/cpsess{m.group(1)}/execute"
          def uapi(mod, func, **params):
              r = s.get(f'{base}/{mod}/{func}', params=params, verify=False, timeout=60)
              return r.json()
          PHP = '<?php\nerror_reporting(E_ALL);\nini_set(\'display_errors\', \'1\');\nheader(\'Content-Type: text/plain; charset=utf-8\');\necho "PHP=" . PHP_VERSION . "\\n";\necho "pdo_mysql=" . (extension_loaded(\'pdo_mysql\') ? \'yes\' : \'NO\') . "\\n";\necho "env_file=" . (is_file(__DIR__ . \'/.env\') ? \'yes\' : \'NO\') . "\\n";\n$files = [\'lib/bootstrap.php\',\'lib/db.php\',\'lib/jwt.php\',\'lib/util.php\',\'lib/mail.php\',\'lib/ratelimit.php\',\'lib/migrate.php\',\'lib/sessions.php\',\'routes/auth.php\',\'routes/profiles.php\',\'routes/users.php\',\'routes/messages.php\',\'routes/community.php\',\'routes/reports.php\',\'routes/verifications.php\',\'routes/wali.php\',\'routes/drafts.php\',\'routes/admin.php\',\'routes/contact.php\'];\nforeach ($files as $f) {\n    $p = __DIR__ . \'/\' . $f;\n    if (!is_file($p)) { echo "MISSING $f\\n"; continue; }\n    try { require $p; echo "OK $f\\n"; }\n    catch (Throwable $e) { echo "FAIL $f :: " . get_class($e) . ": " . substr($e->getMessage(),0,300) . " @ " . basename($e->getFile()) . ":" . $e->getLine() . "\\n"; }\n}\ntry { migrateSchema(); echo "MIGRATE_OK\\n"; }\ncatch (Throwable $e) { echo "MIGRATE_FAIL: " . substr($e->getMessage(),0,300) . "\\n"; }\ntry { db()->query(\'SELECT 1\'); echo "DB_OK\\n"; }\ncatch (Throwable $e) { echo "DB_FAIL: " . get_class($e) . ": " . substr($e->getMessage(),0,300) . "\\n"; }\necho "DONE\\n";\n'
          j = uapi('Fileman', 'save_file_content', dir='/home/shiarishta/public_html/api',
                   file='diag_jarvis.php', content=PHP)
          print('upload:', j.get('status'), (j.get('errors') or [None])[0] if j.get('errors') else '')
          time.sleep(3)
          for i in range(3):
              r = s.get('https://shiarishta.com/api/diag_jarvis.php', verify=False, timeout=40)
              print(f'--- attempt {i+1}: HTTP {r.status_code}, {len(r.text)} bytes ---')
              print(r.text[:4000])
              if r.status_code == 200 and 'DONE' in r.text:
                  break
              time.sleep(5)
          j = uapi('Fileman', 'delete_files', dir='/home/shiarishta/public_html/api',
                   files='diag_jarvis.php')
          print('delete:', j.get('status'))
          PYEOF2
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
