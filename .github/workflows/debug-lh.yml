name: Debug Lighthouse
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse
        run: |
          google-chrome --version || chromium --version || true
          npx -y lighthouse https://shiarishta.com/ \
            --output=json --output-path=/tmp/lh.json --quiet \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile --throttling-method=simulate --max-wait-for-load 45000 || true
          python3 <<'EOF'
          import json
          try:
              d = json.load(open('/tmp/lh.json'))
          except Exception as e:
              print('no lighthouse output:', e); raise SystemExit(0)
          cats = d.get('categories', {})
          for k in ['performance','accessibility','best-practices','seo']:
              v = cats.get(k, {}).get('score')
              print(f"{k}: {round(v*100) if v is not None else 'n/a'}")
          audits = d.get('audits', {})
          for m in ['largest-contentful-paint','interaction-to-next-paint','cumulative-layout-shift','total-blocking-time','speed-index','first-contentful-paint','server-response-time']:
              a = audits.get(m, {})
              print(f"{m}: {a.get('displayValue','n/a')}")
          print('--- top opportunities ---')
          opps = [(a.get('details',{}).get('overallSavingsMs',0), k, (a.get('displayValue') or '')[:60]) for k,a in audits.items() if a.get('details',{}).get('type')=='opportunity']
          for ms,k,dv in sorted(opps, reverse=True)[:6]:
              print(f"{k}: save {int(ms)}ms {dv}")
          EOF
