name: Debug DNS direct
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query authoritative NS directly
        run: |
          for ns in ns72.hostcode.in ns73.hostcode.in; do
            echo "=== $ns ==="
            ip=$(dig +short $ns A | head -1); echo "NS IP: $ip"
            [ -n "$ip" ] && dig +short @$ip shiarishta.com A | head -2 && dig @$ip shiarishta.com A +noall +comments | grep -E "status|flags" | head -2
            echo "--- TCP test ---"
            [ -n "$ip" ] && dig +tcp +short @$ip shiarishta.com A | head -1 || true
          done
          echo "=== DNSSEC check ==="; dig @8.8.8.8 shiarishta.com DNSKEY +noall +comments | grep status
