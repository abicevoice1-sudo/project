name: Diagnose cPanel
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check error logs via cPanel UAPI
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Get the last 50 lines of error log
          echo "=== Error Log ==="
          curl -s -u "$CPANEL_USER:$CPANEL_PASS" \
            "https://ind85.server.broker:2083/execute/Logs/get_error_log" \
            | head -c 5000
          echo ""
          echo "=== Disk Usage ==="
          curl -s -u "$CPANEL_USER:$CPANEL_PASS" \
            "https://ind85.server.broker:2083/execute/DiskUsage/get_disk_usage" \
            | head -c 2000
