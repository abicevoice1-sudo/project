name: Check DNS
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== TXT records (SPF/DKIM) ==="
          dig +short TXT shiarishta.com @8.8.8.8
          echo ""
          echo "=== MX records ==="
          dig +short MX shiarishta.com @8.8.8.8
