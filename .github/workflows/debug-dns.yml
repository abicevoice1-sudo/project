name: Debug DNS delegation
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS delegation
        run: |
          echo "=== resolver default ==="; dig +short shiarishta.com A | head -3
          echo "=== via Google 8.8.8.8 ==="; dig +short @8.8.8.8 shiarishta.com A | head -3; echo "status: $(dig @8.8.8.8 shiarishta.com A +noall +comments | grep status)"
          echo "=== via Cloudflare 1.1.1.1 ==="; dig +short @1.1.1.1 shiarishta.com A | head -3; echo "status: $(dig @1.1.1.1 shiarishta.com A +noall +comments | grep status)"
          echo "=== NS delegation ==="; dig +short shiarishta.com NS
          echo "=== parent glue check ==="; dig +trace +nodnssec shiarishta.com A 2>&1 | tail -8
          echo "=== www ==="; dig +short @8.8.8.8 www.shiarishta.com A | head -2
