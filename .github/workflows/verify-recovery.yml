name: Cleanup probe files
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in diag_jarvis.php dbprobe_jarvis.php; do
            curl -s --max-time 30 "ftp://${{ secrets.FTP_SERVER }}/" \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              -Q "DELE /public_html/api/$f" -o /dev/null -w "$f DELE %{http_code}\n" || echo "$f DELE attempted"
          done
          echo CLEANUP_DONE
