name: Verify API recovery v3
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PYEOF2'
          import requests, re, os, urllib3
          urllib3.disable_warnings()
          CPANEL = 'https://ind85.server.broker:2083'
          USER = os.environ['CPANEL_USER']; PASS = os.environ['CPANEL_PASS']
          s = requests.Session()
          r = s.post(f'{CPANEL}/login/', data={'user': USER, 'pass': PASS},
                     allow_redirects=False, verify=False, timeout=30)
          m = re.search(r'/cpsess(\d+)/', r.headers.get('Location', ''))
          assert m, 'CPANEL LOGIN FAILED'
          base = f"{CPANEL}/cpsess{m.group(1)}/execute"
          def uapi(mod, func, **params):
              r = s.get(f'{base}/{mod}/{func}', params=params, verify=False, timeout=60)
              return r.json()
          j = uapi('Fileman', 'delete_files', dir='/home/shiarishta/public_html/api', **{'file-0': 'diag_jarvis.php'})
          print('diag delete:', j.get('status'))
          j = uapi('Fileman', 'list_files', dir='/home/shiarishta/public_html/api')
          names = [f.get('file') for f in (j.get('data') or [])]
          print('diag still present:', 'diag_jarvis.php' in names)
          A = 'https://shiarishta.com/api'
          r = s.get(f'{A}/health', verify=False, timeout=30)
          print('health:', r.status_code); assert r.status_code == 200 and r.json()['ok'] is True
          r = s.post(f'{A}/auth/login', verify=False, timeout=30,
                     json={'email': 'qatest13@example.com', 'password': 'QaTest#2026-13'})
          print('login:', r.status_code); assert r.status_code == 200
          tok = r.json().get('token'); assert tok
          H = {'Authorization': f'Bearer {tok}'}
          r = s.get(f'{A}/profiles/me', verify=False, timeout=30, headers=H)
          print('profile get:', r.status_code); assert r.status_code == 200
          orig = (r.json().get('profile') or {}).get('bio') or ''
          marker = 'RECOVERY-PROBE-OK'
          r = s.put(f'{A}/profiles/me', verify=False, timeout=30, headers=H, json={'bio': marker})
          print('profile save:', r.status_code, r.text[:120]); assert r.status_code == 200, 'SAVE FAILED'
          r = s.get(f'{A}/profiles/me', verify=False, timeout=30, headers=H)
          saved = (r.json().get('profile') or {}).get('bio') or ''
          print('bio round-trip persisted:', saved == marker); assert saved == marker
          r = s.put(f'{A}/profiles/me', verify=False, timeout=30, headers=H, json={'bio': orig})
          print('bio restored:', r.status_code)
          print('RECOVERY_VERIFIED')
          PYEOF2
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
