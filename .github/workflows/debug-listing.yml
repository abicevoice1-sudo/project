name: Debug public_html listing
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: List public_html root via cPanel UAPI
        env:
          CPANEL_USER: ${{ secrets.FTP_USERNAME }}
          CPANEL_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import requests, re, os, urllib3, json
          urllib3.disable_warnings()
          CPANEL = 'https://ind85.server.broker:2083'
          s = requests.Session()
          r = s.post(f'{CPANEL}/login/', data={'user': os.environ['CPANEL_USER'], 'pass': os.environ['CPANEL_PASS']},
                     allow_redirects=False, verify=False, timeout=30)
          m = re.search(r'/cpsess(\d+)/', r.headers.get('Location', ''))
          if not m:
              print('LOGIN FAILED'); raise SystemExit(1)
          base = f"{CPANEL}/cpsess{m.group(1)}/execute"
          j = s.get(f'{base}/Fileman/list_files', params={'dir': '/home/shiarishta/public_html', 'limit': 200}, verify=False, timeout=30).json()
          files = j.get('data', [])
          for f in files:
              if f.get('type') == 'dir':
                  continue
              print(f"{f.get('size',0):>10}  {f.get('mtime','?')}  {f.get('file')}")
          print('---')
          print('index.html present:', any(f.get('file') == 'index.html' for f in files))
          print('.htaccess present:', any(f.get('file') == '.htaccess' for f in files))
          print('sitemap.xml present:', any(f.get('file') == 'sitemap.xml' for f in files))
          EOF
