name: DB schema probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PYEOF2'
          import os, sys
          try:
              import pymysql
          except ImportError:
              import subprocess
              subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', 'pymysql'])
              import pymysql
          host = os.environ['DB_HOST']; user = os.environ['DB_USER']
          pw = os.environ['DB_PASSWORD']; db = os.environ['DB_NAME']
          print(f'connecting to {host} as {user} db={db}')
          try:
              c = pymysql.connect(host=host, user=user, password=pw, database=db, connect_timeout=15)
          except Exception as e:
              print('CONNECT FAIL:', str(e)[:300]); raise SystemExit(0)
          cur = c.cursor()
          cur.execute("SHOW COLUMNS FROM profiles")
          cols = {r[0]: r[1] for r in cur.fetchall()}
          print('profiles columns:', sorted(cols.keys()))
          for need in ['bio', 'updated_at', 'user_id', 'display_name', 'contact_visibility']:
              print(f'  has {need}:', need in cols)
          cur.execute("SELECT user_id, LEFT(bio,20) FROM profiles WHERE user_id = (SELECT id FROM users WHERE email='qatest13@example.com')")
          print('qatest13 profile row:', cur.fetchone())
          # reproduce the exact upsert from profileUpdate for a bio-only save
          cur.execute("SELECT id FROM users WHERE email='qatest13@example.com'")
          uid = cur.fetchone()[0]
          sql = 'INSERT INTO profiles (user_id, bio) VALUES (%s, %s) ON DUPLICATE KEY UPDATE bio = VALUES(bio), updated_at = UTC_TIMESTAMP()'
          try:
              cur.execute(sql, (uid, 'RECOVERY-PROBE-OK'))
              c.commit()
              print('UPSERT OK, rowcount:', cur.rowcount)
              cur.execute('SELECT bio FROM profiles WHERE user_id=%s', (uid,))
              print('bio now:', cur.fetchone())
              cur.execute('UPDATE profiles SET bio=%s WHERE user_id=%s', ('', uid))
              c.commit()
              print('bio restored')
          except Exception as e:
              print('UPSERT FAIL:', str(e)[:400])
          PYEOF2
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
